# A Task that binds two Workspaces: the code to work on and a shared set of
# tools the command expects to find already on disk.
#
# Each entry is set up independently at its own path, in order. Every entry
# needs a `name`; without a `path` it lands at `/workspace/<name>`, and paths
# must be unique. The first entry is the working directory of `spec.command`.
#
#   ax apply -f examples/multi-workspace.yaml
#   ax describe task multi-workspace-task
#   ax ssh multi-workspace-task -- ls /workspace/my-service /workspace/tools
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: multi-workspace-task
  atespace: default
spec:
  image: "gcr.io/ax-substrate/ate-images/ax-task-runner@sha256:3a0dea6ad8b55278685db58aca6e37dc4ba04056831d45bef3aaeafdca43cac6"
  command: ["npm", "test"]
  workspaces:
    - name: my-service # mounted at /workspace/my-service, the command's working directory
      goal: "Install dependencies and run the test suite"
    - name: team-tools
      path: "/workspace/tools" # explicit mount path
  debug: true # serve guest services so `ax ssh` works; off by default
---
apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: my-service
  atespace: default
spec:
  git:
    - name: origin
      repo: "https://github.com/chalk/chalk.git"
      branch: "main"
---
apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: team-tools
  atespace: default
spec:
  git:
    - name: origin
      repo: "https://github.com/chalk/chalk.git"
      branch: "main"
      dir: "tools"
